<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Shelf">
  <title>Shelf</title>
  <!-- Monochrome variant: transparent background, single-colour shapes. The
       platform (Android themed icons, Windows badges) recolours it and uses
       only the alpha channel, so no gradients or opacity tricks here. Same
       maskable-safe geometry as icon.svg. -->
  <g fill="#000000">
    <rect x="128" y="196" width="54" height="176" rx="14"/>
    <rect x="190" y="152" width="54" height="220" rx="14"/>
    <rect x="252" y="182" width="54" height="190" rx="14"/>
    <rect x="310" y="192" width="52" height="180" rx="13" transform="rotate(10 336 372)"/>
    <rect x="118" y="372" width="278" height="24" rx="12"/>
  </g>
</svg>
