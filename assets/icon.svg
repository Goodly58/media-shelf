<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Shelf">
  <title>Shelf</title>
  <!-- Maskable-safe: every mark sits inside the centred circle of radius 205
       (40% of 512), so aggressive Android / iOS masks never clip it. The
       background is full-bleed so masks of any shape stay opaque. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141c2b"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".1" r=".78">
      <stop offset="0" stop-color="#4f8cff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f97ff"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <linearGradient id="sp2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c76b"/>
      <stop offset="1" stop-color="#d98a3d"/>
    </linearGradient>
    <linearGradient id="sp3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect x="26" y="26" width="460" height="460" rx="112" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>

  <!-- three upright spines + one leaning, standing on a shelf -->
  <g>
    <rect x="128" y="196" width="54" height="176" rx="14" fill="url(#sp1)"/>
    <rect x="190" y="152" width="54" height="220" rx="14" fill="url(#sp2)"/>
    <rect x="252" y="182" width="54" height="190" rx="14" fill="url(#sp3)"/>
    <rect x="310" y="192" width="52" height="180" rx="13" fill="#ffffff" fill-opacity=".17"
          transform="rotate(10 336 372)"/>

    <!-- spine labels -->
    <g fill="#0a1016" fill-opacity=".34">
      <rect x="138" y="216" width="34" height="9" rx="4.5"/>
      <rect x="200" y="172" width="34" height="9" rx="4.5"/>
      <rect x="262" y="202" width="34" height="9" rx="4.5"/>
    </g>
    <rect x="320" y="214" width="32" height="9" rx="4.5" fill="#ffffff" fill-opacity=".22"
          transform="rotate(10 336 372)"/>
  </g>

  <rect x="118" y="372" width="278" height="24" rx="12" fill="#ffffff" fill-opacity=".18"/>
</svg>
