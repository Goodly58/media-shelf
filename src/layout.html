<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="shelf-build" content="{{build}}">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Shelf">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{site}}assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Shelf: games, books, films and series, ranked">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0c11">
<link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org">
<link rel="dns-prefetch" href="https://cdn.cloudflare.steamstatic.com">
<link rel="dns-prefetch" href="https://static.tvmaze.com">
<script>
(function(){try{var t=localStorage.getItem('shelf_theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
// Image handlers live here rather than in app.js so they cover images that settle before it runs.
window.Shelf={
  // Open Library answers a missing cover with a 1x1 gif rather than a 404.
  imgOn:function(e){if(e.naturalWidth<8){e.remove();return}e.classList.add('on')},
  // A kept cover not there yet falls back to its source, Steam portrait art to the store header,
  // a Wikipedia thumbnail to the original file.
  imgFail:function(e){var f=e.getAttribute('data-fb');if(f){e.removeAttribute('data-fb');e.src=f;return}
    var s=e.getAttribute('data-steam'),o=e.src.replace(/\/thumb(\/\w\/\w\w\/[^/]+)\/250px-[^/]+$/,'$1');
    if(s&&e.src.indexOf('library_600x900')>0){e.src='https://cdn.cloudflare.steamstatic.com/steam/apps/'+s+'/header.jpg';e.parentNode.classList.add('wide-art');return}
    if(o!==e.src){e.src=o;return}e.remove()}
};
</script>
<link rel="stylesheet" href="assets/app.css?v={{build}}">
{{head}}
</head>
<body{{bodyAttrs}}>
<a class="skip" href="#main">Skip to content</a>
<header class="nav">
  <div class="wrap nav-in">
    <a class="logo" href="./" aria-label="Shelf home"><span class="logo-mark">{{icon:logo}}</span>Shelf</a>
    <nav class="nav-links" aria-label="Sections">
      <a href="games.html" style="--k:var(--k-games)"{{cur:games}}><span class="dot"></span>Games</a>
      <a href="books.html" style="--k:var(--k-books)"{{cur:books}}><span class="dot"></span>Books</a>
      <a href="movies.html" style="--k:var(--k-movies)"{{cur:movies}}><span class="dot"></span>Films</a>
      <a href="shows.html" style="--k:var(--k-shows)"{{cur:shows}}><span class="dot"></span>Series</a>
      <a href="backlog.html"{{cur:backlog}}>What next</a>
    </nav>
    <div class="nav-act">
      <a class="trailers-tab" href="movies.html?view=trailers" data-trailers>{{icon:play:sm}}<span>Trailers</span></a>
      <button class="search-btn" type="button" data-search aria-label="Search everything">{{icon:search}}<span>Search</span><kbd>/</kbd></button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch light or dark theme">{{icon:sun:theme-light}}{{icon:moon:theme-dark}}</button>
    </div>
  </div>
</header>
{{body}}
<footer class="foot">
  <div class="wrap foot-in">
    <span>Scores from IMDb, Metacritic, Rotten Tomatoes, Steam and Goodreads, re-checked every week. Updated {{updated}}.</span>
    {{credits}}
    <nav aria-label="Footer"><a href="faq.html"{{cur:faq}}>FAQ</a><a href="https://github.com/Goodly58/media-shelf">GitHub</a><a href="https://github.com/Goodly58/media-shelf/blob/main/NOTICE.md">Credits</a></nav>
  </div>
</footer>
<script src="assets/app.js?v={{build}}" defer></script>
{{scripts}}
<script type="speculationrules">
{"prerender": [{"source": "document", "eagerness": "moderate",
  "where": {"and": [{"selector_matches": ".nav-links a, a.logo, .kinds a"}, {"not": {"selector_matches": "[data-trailers], [aria-current]"}}]}}]}
</script>
</body>
</html>
