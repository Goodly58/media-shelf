# Build and publish Shelf to GitHub Pages.
#
# Why this exists: two values on the site are DERIVED and must be regenerated
# whenever content changes —
#   assets/stats.json   the counts the landing page reads (nothing is hard-coded)
#   SW_VERSION          the hash that invalidates the service-worker cache
# Forgetting either one silently ships a stale site to returning visitors, which
# is exactly the failure this repo hit once already. Running the build here means
# it cannot be skipped: pushing to main is the whole deploy.

name: Deploy Shelf

on:
  push:
    branches: [main]
  workflow_dispatch:      # allow a manual re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede one already running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate derived files
        run: |
          node build-pages.js         # movies.html + shows.html from data/*.json
          node build-stats.js         # assets/stats.json
          node build-backlog-index.js # data/backlog-index.json
          node build-similar.js       # data/similar.json — MUST run after the index
          node build-version.js       # SW_VERSION + per-page build stamps

      - name: Validate before publishing
        run: node validate.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
