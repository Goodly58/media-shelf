# Build and publish Shelf to GitHub Pages.
#
# Pushing to main is the whole deploy. The site is generated from src/ and
# data/ into _site/, checked by scripts/validate.js, and only then published.
# If validation fails, nothing is published and the previous site stays live.
# It also runs after the weekly data refresh, whose commit cannot trigger a
# push event itself.

name: Deploy Shelf

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh data]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: npm run build

      - name: Validate before publishing
        run: npm run validate

      - name: Test
        run: npm test

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
