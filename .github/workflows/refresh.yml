# Re-check every score against its source and add new titles, once a week.
#
# scripts/refresh/run.mjs pulls IMDb's datasets, Metacritic, Rotten Tomatoes,
# Steam, Goodreads, Wikidata, Wikipedia and TVmaze, then rewrites data/*.json.
# The slow sources are refreshed a slice per run, oldest first, so the whole
# catalogue is re-verified every few weeks. Fetch caches persist between runs
# in the Actions cache. The deploy workflow publishes the result.

name: Refresh data

on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays, 04:00 UTC
  # A manual run can be limited to some steps with a longer budget, for a catch-up
  # such as fetching every book's Goodreads shelves in one go.
  workflow_dispatch:
    inputs:
      only:
        description: 'Steps to run, comma-separated (blank for all), e.g. books'
        required: false
        default: ''
      budget:
        description: 'Minutes per slow step'
        required: false
        default: '55'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore fetch caches
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: refresh-${{ github.run_id }}
          restore-keys: refresh-

      - name: Refresh from sources
        env:
          ONLY: ${{ inputs.only }}
          BUDGET: ${{ inputs.budget }}
        run: node scripts/refresh/run.mjs --budget="${BUDGET:-55}" ${ONLY:+--only="$ONLY"}

      - name: Save fetch caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: refresh-${{ github.run_id }}

      - name: Build and validate
        run: npm run build && npm run validate

      - name: Commit
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git -c user.name=goodly2018 -c user.email=goodly2018@gmail.com commit -m "$(cat .cache/summary.txt)"
          # The run takes hours; code pushed meanwhile is replayed under the data, not lost.
          git -c user.name=goodly2018 -c user.email=goodly2018@gmail.com pull --rebase origin main
          git push

      # Healthy sources are committed above either way. This step then fails the run
      # (and GitHub emails the owner) if any source broke, checked nothing or shrank.
      - name: Check sources
        run: node scripts/refresh/health.mjs
